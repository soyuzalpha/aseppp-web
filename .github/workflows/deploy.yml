name: Deploy aseppp-web

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aseppp-web:latest .

      - name: Replace container
        run: |
          docker stop aseppp-web 2>/dev/null || true
          docker rm aseppp-web 2>/dev/null || true

          docker run -d \
            --name aseppp-web \
            --restart unless-stopped \
            -p 127.0.0.1:5000:5000 \
            aseppp-web:latest

      - name: Health check
        run: |
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:5000 > /dev/null; then
              echo "Deployment successful"
              exit 0
            fi
            sleep 2
          done

          echo "Deployment failed"
          docker logs aseppp-web --tail 50
          exit 1
